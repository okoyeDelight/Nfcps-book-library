name: NFCPS Watch Agent

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/watch-agent.yml'

permissions:
  contents: read

concurrency:
  group: nfcps-watch-agent
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh, learn, and verify speech-first Watch intelligence
        env:
          API_BASE: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y
          COLLECTOR_HEARTBEAT_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/collector/heartbeat
          AGENT_HEARTBEAT_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/agent/heartbeat
          AGENT_STATUS_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/agent/status
          WATCH_FEED_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/feed
          SHORTS_FEED_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/shorts/feed
          LIVE_LENS_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/live-lens
          SPEECH_HEARTBEAT_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/speech-intelligence/heartbeat
          QA_VIDEO_ID: NFCPSQA0001
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 "$COLLECTOR_HEARTBEAT_URL" -o collector.json
          curl --fail --silent --show-error --retry 2 "$AGENT_HEARTBEAT_URL" -o tick.json
          curl --fail --silent --show-error --retry 2 "$AGENT_STATUS_URL" -o status.json
          curl --fail --silent --show-error --retry 2 "$WATCH_FEED_URL" -o feed.json
          curl --fail --silent --show-error --retry 2 "$SHORTS_FEED_URL" -o shorts.json
          curl --fail --silent --show-error --retry 2 -H 'Content-Type: application/json' \
            -d '{"text":"Jesus taught that we should love the Lord our God with all our heart, soul and mind, and love our neighbour as ourselves."}' \
            "$LIVE_LENS_URL" -o live-lens.json

          speech_url="$API_BASE/api/watch/sermon/$QA_VIDEO_ID/speech-lens"
          curl --fail --silent --show-error --retry 2 -H 'Content-Type: application/json' \
            -d '{"text":"Jesus said the greatest commandment is to love the Lord your God with all your heart, soul and mind, and to love your neighbour as yourself.","start":0,"end":25,"title":"NFCPS Speech QA","creator":"NFCPS QA","category":"Bible Teaching"}' \
            "$speech_url" -o speech1.json
          curl --fail --silent --show-error --retry 2 -H 'Content-Type: application/json' \
            -d '{"text":"Paul teaches believers not to be conformed to this world, but to be transformed by the renewing of the mind, presenting our bodies to God as a living sacrifice.","start":25,"end":50,"title":"NFCPS Speech QA","creator":"NFCPS QA","category":"Bible Teaching"}' \
            "$speech_url" -o speech2.json
          curl --fail --silent --show-error --retry 2 -H 'Content-Type: application/json' \
            -d '{"text":"Faith comes by hearing the word of God, but James also tells us to be doers of the word and not hearers only, so truth should become obedience.","start":50,"end":75,"title":"NFCPS Speech QA","creator":"NFCPS QA","category":"Bible Teaching"}' \
            "$speech_url" -o speech3.json

          curl --fail --silent --show-error --retry 2 "$SPEECH_HEARTBEAT_URL" -o speech-heartbeat.json
          intelligence_url="$API_BASE/api/watch/sermon/$QA_VIDEO_ID/intelligence?title=NFCPS%20Speech%20QA&creator=NFCPS%20QA&category=Bible%20Teaching"
          curl --fail --silent --show-error --retry 2 "$intelligence_url" -o intelligence.json

          python - <<'PY'
          import json
          names = ['collector','tick','status','feed','shorts','live-lens','speech1','speech2','speech3','speech-heartbeat','intelligence']
          data = {}
          for name in names:
              with open(f'{name}.json', encoding='utf-8') as handle:
                  data[name] = json.load(handle)
          intelligence = data['intelligence']
          result = {
              'collector': data['collector'],
              'agent': {
                  'publishedCount': data['status'].get('publishedCount'),
                  'totalAccepted': data['status'].get('totalAccepted'),
                  'totalUnsafe': data['status'].get('totalUnsafe'),
              },
              'shortCount': data['shorts'].get('count'),
              'liveLens': {
                  'available': data['live-lens'].get('available'),
                  'references': [p.get('reference') for p in data['live-lens'].get('passages', [])],
              },
              'speechProgress': [data[f'speech{i}'].get('progress') for i in (1,2,3)],
              'speechImmediateRefs': [[p.get('reference') for p in data[f'speech{i}'].get('passages', [])] for i in (1,2,3)],
              'speechCompiler': data['speech-heartbeat'],
              'package': {
                  'available': intelligence.get('available'),
                  'language': intelligence.get('language'),
                  'themes': intelligence.get('themes'),
                  'chapters': len(intelligence.get('chapters') or []),
                  'claims': len(intelligence.get('claims') or []),
                  'scriptures': len(intelligence.get('scriptures') or []),
                  'trail': len(intelligence.get('scriptureTrail') or []),
                  'passageRefs': [p.get('reference') for p in (intelligence.get('passages') or [])[:8]],
              },
          }
          print(json.dumps(result, ensure_ascii=False))
          if not intelligence.get('available'):
              raise SystemExit('speech-first package was not available')
          if intelligence.get('language') != 'spoken-word':
              raise SystemExit('speech-first package did not use spoken-word transcript')
          if not (intelligence.get('passages') or []):
              raise SystemExit('speech-first package returned no canonical passages')
          PY
