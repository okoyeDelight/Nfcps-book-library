name: NFCPS Watch Agent

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/watch-agent.yml'

permissions:
  contents: read

concurrency:
  group: nfcps-watch-agent
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh, learn, and verify transcript-first Watch intelligence
        env:
          COLLECTOR_HEARTBEAT_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/collector/heartbeat
          AGENT_HEARTBEAT_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/agent/heartbeat
          AGENT_STATUS_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/agent/status
          SPEECH_HEARTBEAT_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/speech-intelligence/heartbeat
          TRANSCRIPT_SELFTEST_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/transcript-selftest
          PREPARE_DIVINE_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/sermon/b2xNY69gxGo/prepare-source
          DIVINE_TRANSCRIPT_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/sermon/b2xNY69gxGo/transcript?title=Divine%20Prosperity%20%28Part%201%29%20%7C%20Pastor%20Lawrence%20Oyor%26creator=Lawrence%20Oyor
          WATCH_FEED_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/feed
          SHORTS_FEED_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/shorts/feed
          LIVE_LENS_URL: https://api-v2.appdeploy.ai/app/nfcps-book-library-c2ma7y/api/watch/live-lens
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 "$COLLECTOR_HEARTBEAT_URL" -o collector.json
          curl --fail --silent --show-error --retry 2 "$AGENT_HEARTBEAT_URL" -o tick.json
          curl --fail --silent --show-error --retry 2 "$AGENT_STATUS_URL" -o status.json
          curl --fail --silent --show-error --retry 2 "$SPEECH_HEARTBEAT_URL" -o speech.json
          curl --fail --silent --show-error --retry 2 --max-time 90 "$TRANSCRIPT_SELFTEST_URL" -o transcript.json

          curl --silent --show-error --retry 1 --max-time 60 -H 'Content-Type: application/json' \
            -d '{"title":"Divine Prosperity (Part 1) | Pastor Lawrence Oyor","creator":"Lawrence Oyor","category":"Bible Teaching","at":0}' \
            "$PREPARE_DIVINE_URL" -o prepared0.json
          READY="$(python -c "import json; d=json.load(open('prepared0.json')); print('1' if d.get('progress',{}).get('ready') else '0')" 2>/dev/null || echo 0)"
          if [ "$READY" != "1" ]; then
            curl --silent --show-error --retry 1 --max-time 60 -H 'Content-Type: application/json' \
              -d '{"title":"Divine Prosperity (Part 1) | Pastor Lawrence Oyor","creator":"Lawrence Oyor","category":"Bible Teaching","at":90}' \
              "$PREPARE_DIVINE_URL" -o prepared1.json
          else
            cp prepared0.json prepared1.json
          fi
          curl --fail --silent --show-error --retry 2 "$DIVINE_TRANSCRIPT_URL" -o divine.json

          curl --fail --silent --show-error --retry 2 "$WATCH_FEED_URL" -o feed.json
          curl --fail --silent --show-error --retry 2 "$SHORTS_FEED_URL" -o shorts.json
          curl --fail --silent --show-error --retry 2 -H 'Content-Type: application/json' \
            -d '{"text":"Jesus taught that we should love the Lord our God with all our heart, soul and mind, and love our neighbour as ourselves."}' \
            "$LIVE_LENS_URL" -o lens.json

          python - <<'PY'
          import json, sys
          def load(name):
              try:
                  with open(name, encoding='utf-8') as f: return json.load(f)
              except Exception as exc:
                  return {'available': False, 'error': str(exc)}
          collector=load('collector.json')
          tick=load('tick.json')
          status=load('status.json')
          speech=load('speech.json')
          transcript=load('transcript.json')
          prepared0=load('prepared0.json')
          prepared1=load('prepared1.json')
          divine=load('divine.json')
          feed=load('feed.json')
          shorts=load('shorts.json')
          lens=load('lens.json')
          videos = feed.get('videos') or []
          lawrence = [
              {'id': x.get('id'), 'title': x.get('title'), 'creator': x.get('creator'), 'source': x.get('source')}
              for x in videos
              if 'lawrence' in str(x.get('creator', '')).lower() or x.get('creatorKey') == 'lawrence'
          ][:12]
          summary = {
              'collector': collector,
              'agentTick': tick,
              'agent': {
                  'publishedCount': status.get('publishedCount'),
                  'totalAccepted': status.get('totalAccepted'),
                  'totalUnsafe': status.get('totalUnsafe'),
                  'frozenUntil': status.get('frozenUntil'),
              },
              'speechCompiler': speech,
              'transcriptSelftest': transcript,
              'divinePrepare0': prepared0,
              'divinePrepare1': prepared1,
              'divineTranscript': divine,
              'lawrenceWatchItems': lawrence,
              'watchDiscoveryCount': feed.get('discoveryCount'),
              'shortCount': shorts.get('count'),
              'shortCreators': len({x.get('creatorKey') for x in (shorts.get('clips') or []) if x.get('creatorKey')}),
              'liveLens': {
                  'available': lens.get('available'),
                  'references': [p.get('reference') for p in (lens.get('passages') or [])],
              },
          }
          print(json.dumps(summary, ensure_ascii=False))
          if not transcript.get('controlOk'):
              print('ERROR: Known-caption control failed; YouTube transcript ingestion is unhealthy.', file=sys.stderr)
              sys.exit(1)
          if not divine.get('available') or not divine.get('segments') or not divine.get('durationSeconds'):
              print('ERROR: Divine Prosperity still has no reusable timed transcript after trusted-source preparation.', file=sys.stderr)
              sys.exit(1)
          print('Divine Prosperity transcript verified:', divine.get('source'), divine.get('segments'), divine.get('durationSeconds'))
          PY
