name: Publish NFCPS One 1.8.12 Public APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nfcps-1-8-12.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed 1.8.12 artifact
        env:
          ARTIFACT_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-c494-8246-b870-8bd6af3fdbd1/raw?se=2026-10-03T10%3A08%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=c0681ec5-de21-5f5e-9b6c-f303e1fb100c&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T06%3A43%3A24Z&ske=2026-10-04T06%3A43%3A24Z&sks=b&skv=2026-02-06&sig=YzjX%2BIjbDe%2BeOO0mpeAW/yh9CsIDT9B7X5kbxX4ERB4%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed-artifact.zip
          unzip -o signed-artifact.zip NFCPS-One.apk
          test -s NFCPS-One.apk
          echo "17062f5ac0b1883445186114c1dc9158d3ebab76815e3d90e677a7bd97493683  NFCPS-One.apk" | sha256sum -c -
          ls -lh NFCPS-One.apk

      - name: Publish to public rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view nfcps-one-latest --repo okoyeDelight/Nfcps-book-library >/dev/null
          gh release upload nfcps-one-latest NFCPS-One.apk --clobber --repo okoyeDelight/Nfcps-book-library

      - name: Verify public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view nfcps-one-latest --repo okoyeDelight/Nfcps-book-library --json assets
