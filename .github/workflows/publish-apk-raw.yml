name: Publish NFCPS APK raw mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-raw.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish current signed APK on raw.githubusercontent.com
        shell: bash
        run: |
          set -euo pipefail
          TMP_ZIP="$RUNNER_TEMP/NFCPS-One-Signed-Android.zip"
          TMP_DIR="$RUNNER_TEMP/nfcps-apk"
          curl --fail --location --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-15a4-8210-b253-0983d87863b0/raw?se=2026-10-02T13%3A55%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=31ea1ed7-bb82-5bbe-bd03-c6f72b1bc148&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T05%3A02%3A05Z&ske=2026-10-03T05%3A02%3A05Z&sks=b&skv=2026-02-06&sig=luAnjw%2Bj%2BjiqsuCvUIM3pYfKaxPK5VU9LQZq9pTieMA%3D' --output "$TMP_ZIP"
          mkdir -p "$TMP_DIR"
          unzip -q "$TMP_ZIP" -d "$TMP_DIR"
          test -s "$TMP_DIR/NFCPS-One.apk"
          echo 'ce4fcb12a903ecec7eaa588455872a84b4b90bdf204d25a4042246a06312dfc4  '"$TMP_DIR/NFCPS-One.apk" | sha256sum -c -
          git config user.name 'NFCPS Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git switch --orphan nfcps-apk-work
          git rm -rf . >/dev/null 2>&1 || true
          cp "$TMP_DIR/NFCPS-One.apk" NFCPS-One.apk
          printf '%s\n' 'NFCPS One 1.8.9 · versionCode 34' > VERSION.txt
          git add NFCPS-One.apk VERSION.txt
          git commit -m 'Publish NFCPS One 1.8.9 slim APK'
          git push --force origin HEAD:nfcps-apk
