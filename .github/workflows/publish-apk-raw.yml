name: Publish NFCPS APK raw mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-raw.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish current signed APK on raw.githubusercontent.com
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TMP_APK="$RUNNER_TEMP/NFCPS-One.apk"
          gh release download nfcps-one-latest --repo "$GITHUB_REPOSITORY" --pattern 'NFCPS-One.apk' --output "$TMP_APK" --clobber
          echo '25f6437973f7036f23f9a54f2619933d859288543e8c4384e082bbbde1a75afe  '"$TMP_APK" | sha256sum -c -
          git config user.name 'NFCPS Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git switch --orphan nfcps-apk-work
          git rm -rf . >/dev/null 2>&1 || true
          cp "$TMP_APK" NFCPS-One.apk
          printf '%s\n' 'NFCPS One 1.8.9 · versionCode 34' > VERSION.txt
          git add NFCPS-One.apk VERSION.txt
          git commit -m 'Publish NFCPS One 1.8.9 APK'
          git push --force origin HEAD:nfcps-apk
