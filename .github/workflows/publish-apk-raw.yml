name: Publish NFCPS APK raw mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-raw.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish current signed APK on raw.githubusercontent.com
        shell: bash
        run: |
          set -euo pipefail
          TMP_ZIP="$RUNNER_TEMP/NFCPS-One-Signed-Android.zip"
          TMP_DIR="$RUNNER_TEMP/nfcps-apk"
          curl --fail --location --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-2d34-8243-ac0f-a6b67c7ab7f4/raw?se=2026-10-02T13%3A41%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=455b4aa3-8fac-597b-9a10-b0ce781ce0db&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T05%3A37%3A14Z&ske=2026-10-03T05%3A37%3A14Z&sks=b&skv=2026-02-06&sig=/J%2BtLsiQ/5IwOeMi5Ah9eWr3V0V/TNQbbjxFNdCdmVg%3D' --output "$TMP_ZIP"
          mkdir -p "$TMP_DIR"
          unzip -q "$TMP_ZIP" -d "$TMP_DIR"
          test -s "$TMP_DIR/NFCPS-One.apk"
          echo '4568500f1b38ae0ce5750757a7812ece7cdbbf2c4afa8cf72e674fd1d91c8adf  '"$TMP_DIR/NFCPS-One.apk" | sha256sum -c -
          git config user.name 'NFCPS Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git switch --orphan nfcps-apk-work
          git rm -rf . >/dev/null 2>&1 || true
          cp "$TMP_DIR/NFCPS-One.apk" NFCPS-One.apk
          printf '%s\n' 'NFCPS One 1.8.8 · versionCode 33' > VERSION.txt
          git add NFCPS-One.apk VERSION.txt
          git commit -m 'Publish NFCPS One 1.8.8 slim APK'
          git push --force origin HEAD:nfcps-apk
