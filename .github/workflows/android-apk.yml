name: Build NFCPS One Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p native/android --no-daemon assembleDebug

      - name: Prepare APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk NFCPS-One.apk

      - name: Publish rolling Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nfcps-one-latest >/dev/null 2>&1; then
            gh release upload nfcps-one-latest NFCPS-One.apk --clobber
          else
            gh release create nfcps-one-latest NFCPS-One.apk --target main --title 'NFCPS One — Latest Android Build' --notes 'Installable Android build of NFCPS One. The app loads the live NFCPS experience, so normal content and interface deployments update inside the app automatically.'
          fi

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFCPS-One-Android
          path: NFCPS-One.apk
