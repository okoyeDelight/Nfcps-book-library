name: Build Signed NFCPS One Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore the signer used by the current public APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nfcps-signing-seed"
          gh run download 34188933189 \
            --repo "$GITHUB_REPOSITORY" \
            --name NFCPS-One-Signed-Android \
            --dir "$RUNNER_TEMP/nfcps-signing-seed"
          test -s "$RUNNER_TEMP/nfcps-signing-seed/NFCPS-One-signing-key.jks"
          test -s "$RUNNER_TEMP/nfcps-signing-seed/NFCPS-One-signing-info.txt"
          cp "$RUNNER_TEMP/nfcps-signing-seed/NFCPS-One-signing-key.jks" "$RUNNER_TEMP/nfcps-one-release.jks"
          SIGNING_PASSWORD="$(sed -n 's/^Keystore password: //p' "$RUNNER_TEMP/nfcps-signing-seed/NFCPS-One-signing-info.txt" | head -n 1)"
          test -n "$SIGNING_PASSWORD"
          echo "::add-mask::$SIGNING_PASSWORD"
          echo "SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"

      - name: Use official NFCPS logo as Android icon
        run: |
          curl --fail --location --retry 3 'https://nfcps-book-library-c2ma7y.v2.appdeploy.ai/resources/nfcps-logo.png' --output native/android/app/src/main/res/drawable/nfcps_logo.png
          test -s native/android/app/src/main/res/drawable/nfcps_logo.png

      - name: Build unsigned release APK
        run: gradle -p native/android --no-daemon assembleRelease

      - name: Sign release APK with the existing NFCPS identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED='native/android/app/build/outputs/apk/release/app-release-unsigned.apk'
          "$BUILD_TOOLS/zipalign" -f -v -p 4 "$UNSIGNED" NFCPS-One-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/nfcps-one-release.jks" \
            --ks-key-alias nfcps-one \
            --ks-pass "pass:$SIGNING_PASSWORD" \
            --key-pass "pass:$SIGNING_PASSWORD" \
            --out NFCPS-One.apk \
            NFCPS-One-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs NFCPS-One.apk

      - name: Publish rolling Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nfcps-one-latest >/dev/null 2>&1; then
            gh release upload nfcps-one-latest NFCPS-One.apk --clobber
          else
            gh release create nfcps-one-latest NFCPS-One.apk --target main --title 'NFCPS One — Signed Android APK' --notes 'Installable Android package for NFCPS One. Normal AppDeploy content and interface deployments continue updating inside the installed app automatically.'
          fi

      - name: Upload signed package
        uses: actions/upload-artifact@v4
        with:
          name: NFCPS-One-Signed-Android
          retention-days: 30
          path: NFCPS-One.apk
