name: Apply Read and Library service routing maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-read-library-service-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Apply native maintenance patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          main = 'native/android/app/src/main/java/org/nfcpsunizik/one/MainActivity.java'
          replace_once(main,
              'import android.webkit.WebResourceRequest;\nimport android.webkit.WebSettings;',
              'import android.webkit.WebResourceRequest;\nimport android.webkit.WebResourceResponse;\nimport android.webkit.WebSettings;')

          replace_once(main,
              '''        String nextUrl = BootstrapConfig.nativeUrl(config.appUrl);\n        String previousUrl = currentAppUrl;\n        bootstrapConfig = config;\n        currentAppUrl = nextUrl;\n        if (webView != null && !sameTarget(previousUrl, nextUrl)) {\n            webView.stopLoading();\n            webView.loadUrl(nextUrl);\n        }''',
              '''        String nextUrl = BootstrapConfig.nativeUrl(config.appUrl);\n        String visibleUrl = webView != null ? webView.getUrl() : null;\n        bootstrapConfig = config;\n        currentAppUrl = nextUrl;\n        if (webView != null && !sameTarget(visibleUrl, nextUrl)) {\n            webView.stopLoading();\n            webView.loadUrl(nextUrl);\n        }''')

          replace_once(main,
              'settings.setUserAgentString(settings.getUserAgentString() + " NFCPSOne/1.5.2");',
              'settings.setUserAgentString(settings.getUserAgentString() + " NFCPSOne/1.6.7");')

          replace_once(main,
              '''        target.setWebViewClient(new WebViewClient() {\n            @Override\n            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {''',
              '''        target.setWebViewClient(new WebViewClient() {\n            @Override\n            public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {\n                if (!popup) {\n                    WebResourceResponse routed = NativeServiceRouter.interceptGet(request);\n                    if (routed != null) return routed;\n                }\n                return super.shouldInterceptRequest(view, request);\n            }\n\n            @Override\n            public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {''')

          replace_once(main,
              '''                    view.evaluateJavascript(\n                            "window.__NFCPS_NATIVE__=true;window.__NFCPS_DIRECT_AUDIO__=true;window.__NFCPS_SPEECH_TOKEN__="\n                                    + JSONObject.quote(token)\n                                    + ";document.documentElement.classList.add('nfcps-native-app');",\n                            null\n                    );\n                    if (updateManager != null) updateManager.checkForUpdatesOnce();''',
              '''                    view.evaluateJavascript(\n                            "window.__NFCPS_NATIVE__=true;window.__NFCPS_DIRECT_AUDIO__=true;window.__NFCPS_SPEECH_TOKEN__="\n                                    + JSONObject.quote(token)\n                                    + ";document.documentElement.classList.add('nfcps-native-app');",\n                            null\n                    );\n                    view.evaluateJavascript(NativeServiceRouter.libraryPostBridgeScript(), null);\n                    if (updateManager != null) updateManager.checkForUpdatesOnce();''')

          discovery = 'native/android/app/src/main/java/org/nfcpsunizik/one/NativeReadDiscoveryController.java'
          replace_once(discovery,
              "img.onload = function(){ fallback.style.display='none'; };",
              "img.onload = function(){ fallback.style.setProperty('display','none','important'); };")

          cover_patch = 'native/android/app/src/main/java/org/nfcpsunizik/one/NativeReadCoverPatch.java'
          replace_once(cover_patch,
              "img.onload=function(){if(fallback)fallback.style.display='none';img.style.display='block';};",
              "img.onload=function(){if(fallback)fallback.style.setProperty('display','none','important');img.style.display='block';};")

          gradle = 'native/android/app/build.gradle'
          replace_once(gradle, 'versionCode 17', 'versionCode 18')
          replace_once(gradle, "versionName '1.6.6'", "versionName '1.6.7'")

          Path('.github/workflows/apply-read-library-service-routing.yml').unlink()

      - name: Commit native maintenance source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/android .github/workflows/apply-read-library-service-routing.yml
          git commit -m 'Route Read and Library services without changing UI'
          git push
