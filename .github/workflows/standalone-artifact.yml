name: Package standalone NFCPS frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'watch-netlify/**'
      - 'appdeploy-live/src/**'
      - 'appdeploy-live/styles/**'
      - '.github/workflows/standalone-artifact.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        working-directory: watch-netlify
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: nfcps-one-standalone
          path: watch-netlify/out
          if-no-files-found: error
