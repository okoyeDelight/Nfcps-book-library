name: Validate standalone NFCPS One frontend

on:
  push:
    branches: [main]
    paths:
      - 'watch-netlify/**'
      - 'appdeploy-live/src/**'
      - 'appdeploy-live/styles/**'
      - 'netlify.toml'
      - '.github/workflows/watch-netlify.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch-netlify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static NFCPS One frontend
        run: npm run build
      - name: Verify exported NFCPS One pages
        run: |
          test -f out/index.html
          test -f out/watch/index.html
          test -d out/_next
