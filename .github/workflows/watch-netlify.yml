name: Validate NFCPS Watch front door

on:
  push:
    branches: [main]
    paths:
      - 'watch-netlify/**'
      - 'appdeploy-live/src/WatchExperienceV3.tsx'
      - 'appdeploy-live/src/WatchDeepFeatures.tsx'
      - 'appdeploy-live/src/ShortsEngine.tsx'
      - 'appdeploy-live/src/SpokenSermonLens.tsx'
      - 'appdeploy-live/src/ScriptureLens.tsx'
      - 'appdeploy-live/src/AccountSync.tsx'
      - 'appdeploy-live/styles/**'
      - 'netlify.toml'
      - '.github/workflows/watch-netlify.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch-netlify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static Watch route
        run: npm run build
      - name: Verify exported Watch page
        run: |
          test -f out/watch/index.html
          test -d out/_next
