name: Mirror NFCPS APK to public release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-nfcps-apk-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-32b0-8210-845b-5909030c5c35/raw?se=2026-10-02T12%3A30%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=11c8512b-9162-5183-be84-7cad6c4b2692&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A20%3A52Z&ske=2026-10-03T02%3A20%3A52Z&sks=b&skv=2026-02-06&sig=AWiF6y5a81ts4hlcosotO9dit24zwDPjEFCwd5mRk64%3D' --output artifact.zip
          unzip -q artifact.zip -d artifact
          test -s artifact/NFCPS-One.apk
          echo '591e820e6fc2b8b6d07edf6337718d957e82efffea8a1a8984c391fadacf878b  artifact/NFCPS-One.apk' | sha256sum -c -

      - name: Publish public rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view nfcps-one-latest >/dev/null 2>&1; then
            gh release upload nfcps-one-latest artifact/NFCPS-One.apk --clobber
          else
            gh release create nfcps-one-latest artifact/NFCPS-One.apk --target main --title 'NFCPS One — Android Update' --notes 'Public signed update package for existing NFCPS One installations.'
          fi
