name: Mirror NFCPS 1.8.9 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-nfcps-apk-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed NFCPS APK artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-acfc-81f4-9b9d-d8be08c11533/raw?se=2026-10-02T13%3A37%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=6660d962-6f55-53c5-a626-df310cd31990&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T05%3A37%3A12Z&ske=2026-10-03T05%3A37%3A12Z&sks=b&skv=2026-02-06&sig=wrnRT%2BW7RlQ8w2eWFXPshgq8uTb4bER769w0%2BthldR0%3D' --output artifact.zip
          unzip -q artifact.zip -d artifact
          test -s artifact/NFCPS-One.apk
          echo '4568500f1b38ae0ce5750757a7812ece7cdbbf2c4afa8cf72e674fd1d91c8adf  artifact/NFCPS-One.apk' | sha256sum -c -

      - name: Publish public rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view nfcps-one-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload nfcps-one-latest artifact/NFCPS-One.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create nfcps-one-latest artifact/NFCPS-One.apk --repo "$GITHUB_REPOSITORY" --target main --title 'NFCPS One — Android Update' --notes 'Signed public update package for existing NFCPS One installations.'
          fi

      - name: Refresh raw APK mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NFCPS Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git switch --orphan nfcps-apk-work
          git rm -rf . >/dev/null 2>&1 || true
          cp artifact/NFCPS-One.apk NFCPS-One.apk
          printf '%s\n' 'NFCPS One 1.8.9 · versionCode 34' > VERSION.txt
          git add NFCPS-One.apk VERSION.txt
          git commit -m 'Publish NFCPS One 1.8.9 APK'
          git push --force origin HEAD:nfcps-apk
