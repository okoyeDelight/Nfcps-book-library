name: Integrate origin state migrator

on:
  push:
    branches: [main]
    paths:
      - 'native/android/app/src/main/java/org/nfcpsunizik/one/OriginStateMigrator.java'
      - '.github/workflows/integrate-origin-state-migrator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Wire migration into MainActivity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('native/android/app/src/main/java/org/nfcpsunizik/one/MainActivity.java')
          s = p.read_text()
          if 'private OriginStateMigrator originStateMigrator;' not in s:
              s = s.replace('    private UpdateManager updateManager;\n', '    private UpdateManager updateManager;\n    private OriginStateMigrator originStateMigrator;\n')
          if 'originStateMigrator = new OriginStateMigrator(this, webView);' not in s:
              s = s.replace('        updateManager = new UpdateManager(this);\n', '        updateManager = new UpdateManager(this);\n        originStateMigrator = new OriginStateMigrator(this, webView);\n')
          gate = '        if (originStateMigrator != null && OriginStateMigrator.isFlootUrl(nextUrl) && !originStateMigrator.isReadyForFloot()) return;\n'
          if gate.strip() not in s:
              s = s.replace('        String nextUrl = BootstrapConfig.nativeUrl(config.appUrl);\n', '        String nextUrl = BootstrapConfig.nativeUrl(config.appUrl);\n' + gate)
          hook = '                    if (originStateMigrator != null) originStateMigrator.onPageFinished(url);\n'
          if hook.strip() not in s:
              s = s.replace('                if (!popup) {\n                    String token = nativeSpeechBridge != null ? nativeSpeechBridge.getSessionToken() : "";\n', '                if (!popup) {\n' + hook + '                    String token = nativeSpeechBridge != null ? nativeSpeechBridge.getSessionToken() : "";\n')
          p.write_text(s)
          PY
      - name: Build Android debug APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified integration
        run: |
          if git diff --quiet; then
            echo 'Origin migration is already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/android/app/src/main/java/org/nfcpsunizik/one/MainActivity.java
          git commit -m 'Wire safe NFCPS origin state migration'
          git push origin HEAD:main
