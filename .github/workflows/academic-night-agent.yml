name: NFCPS Academic Continuous Agent (free, review only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academic-night-agent.yml'
  schedule:
    # Every 15 minutes, all day. GitHub may delay/skip scheduled runs.
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nfcps-academic-night-agent
  cancel-in-progress: false

jobs:
  propose-one-fix:
    if: github.repository == 'okoyeDelight/Nfcps-book-library'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OLLAMA_MODEL: qwen2.5-coder:1.5b
    steps:
      - name: Check out source (no persisted GitHub credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Baseline safety contracts
        run: |
          set -euo pipefail
          node --check --input-type=commonjs < academic-reader/frontend/NfcpsAcademicBookReader.jsx
          python3 -m unittest discover -s academic-reader/agent/tests -p 'test_*.py' -v

      - name: Skip expensive inference when no work or draft is pending
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh pr list --head automation/academic-night-agent-free --state open --json number --jq 'length')" -gt 0 ]; then
            echo "needs_ai=false" >> "$GITHUB_OUTPUT"
            echo "Existing Academic proposal is waiting for review: no new model download."
            exit 0
          fi
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          file = Path('academic-reader/agent/free_night_agent.py')
          spec = importlib.util.spec_from_file_location('free_night_agent', file)
          agent = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(agent)
          source = agent.SOURCE.read_text(encoding='utf-8')
          ready = agent.choose_issue(source) is not None
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('needs_ai=' + ('true' if ready else 'false') + '\\n')
          print('Free model needed:', ready)
          PY

      - name: Start local open-source coding model
        if: steps.plan.outputs.needs_ai == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          timeout 12m ollama pull "$OLLAMA_MODEL"

      - name: Propose one tiny improvement (offline from AI providers)
        if: steps.plan.outputs.needs_ai == 'true'
        shell: bash
        run: |
          set -euo pipefail
          timeout 20m python3 academic-reader/agent/free_night_agent.py

      - name: Reject unsafe or unverified changes
        if: steps.plan.outputs.needs_ai == 'true'
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          changed="$( { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u )"
          if [ -z "$changed" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No bounded, evidence-backed fix was accepted tonight."
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              academic-reader/frontend/NfcpsAcademicBookReader.jsx) ;;
              *) echo "::error::Local agent touched a prohibited path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          node --check --input-type=commonjs < academic-reader/frontend/NfcpsAcademicBookReader.jsx
          python3 -m unittest discover -s academic-reader/agent/tests -p 'test_*.py' -v
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open or update a draft PR only
        if: steps.guard.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: academic-reader/frontend/NfcpsAcademicBookReader.jsx
          branch: automation/academic-night-agent-free
          base: main
          draft: true
          commit-message: 'propose: one free-model Academic Reader fix'
          title: 'Night agent (free model): review Academic Reader fix'
          body: |
            Automatic SOURCE-ONLY proposal from a small local open-source model.
            No paid AI API was used. No live service was changed or deployed.
            AI may be wrong even when static checks pass.

            Human review and real mobile / source-fidelity / service tests are
            mandatory before merging or publishing to NFCPS One.
            The agent is limited to a pre-reviewed single-snippet change.
