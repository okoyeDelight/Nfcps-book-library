name: Publish NFCPS One 1.8.11 Public APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nfcps-1-8-11.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed 1.8.11 APK
        env:
          APK_SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d6c4-8210-bb8f-6bdf11b38a85/raw?se=2026-10-02T18%3A02%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=d04df5fb-0ff3-5193-92ab-ea104a214859&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A30%3A09Z&ske=2026-10-03T02%3A30%3A09Z&sks=b&skv=2026-02-06&sig=b3/nWWd7jww1u%2BSl2AV9zCvbkf%2BDF9e7oUn/uY78uXY%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$APK_SOURCE_URL" --output signed-artifact.zip
          test -s signed-artifact.zip
          unzip -o signed-artifact.zip NFCPS-One.apk
          test -s NFCPS-One.apk
          echo "e197a5bd14053a29030007f57f0f5e8c04f2fa38721d6fb5e1be9b282c815b04  NFCPS-One.apk" | sha256sum -c -
          ls -lh NFCPS-One.apk

      - name: Publish to public rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view nfcps-one-latest --repo okoyeDelight/Nfcps-book-library >/dev/null
          gh release upload nfcps-one-latest NFCPS-One.apk --clobber --repo okoyeDelight/Nfcps-book-library

      - name: Verify public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view nfcps-one-latest --repo okoyeDelight/Nfcps-book-library --json assets
