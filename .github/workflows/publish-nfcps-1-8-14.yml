name: Publish NFCPS One 1.8.14 Public APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nfcps-1-8-14.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed 1.8.14 artifact
        env:
          ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-de28-8210-9b25-f957e0c9fa34/raw?se=2026-10-03T13%3A10%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=ba902653-07e2-57c3-8fd8-3a821c7beb63&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T06%3A07%3A05Z&ske=2026-10-04T06%3A07%3A05Z&sks=b&skv=2026-02-06&sig=9QvH0/i6OhlDkbPaHmOm0JTlGq2Emzm%2BIKrEszGEd4k%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output signed-artifact.zip
          unzip -o signed-artifact.zip NFCPS-One.apk
          test -s NFCPS-One.apk
          echo "cf1ca8c7f2b69fc131f9d7155c3d8089de10dbd7ce622fc65a24794653a40583  NFCPS-One.apk" | sha256sum -c -

      - name: Publish public rolling APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view nfcps-one-latest --repo okoyeDelight/Nfcps-book-library >/dev/null
          gh release upload nfcps-one-latest NFCPS-One.apk --clobber --repo okoyeDelight/Nfcps-book-library

      - name: Verify public asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view nfcps-one-latest --repo okoyeDelight/Nfcps-book-library --json assets
