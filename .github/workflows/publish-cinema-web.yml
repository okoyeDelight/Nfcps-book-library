name: Publish NFCPS Cinema web mirror

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cinema-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch compiled NFCPS Cinema frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-26d4-8243-9d43-c6541b32a497/raw?se=2026-10-02T14%3A34%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=fb33df6d-11af-53bc-89eb-f00da754f7a1&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T05%3A02%3A05Z&ske=2026-10-03T05%3A02%3A05Z&sks=b&skv=2026-02-06&sig=oZxcGSvEN4MSI8eKAyY8gX4NSoQLzVrGFWPgwLN9F5w%3D' -o "$RUNNER_TEMP/cinema.zip"
          mkdir -p "$RUNNER_TEMP/cinema"
          unzip -q "$RUNNER_TEMP/cinema.zip" -d "$RUNNER_TEMP/cinema"
          test -s "$RUNNER_TEMP/cinema/index.html"
      - name: Publish clean static branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NFCPS Web Release'
          git config user.email 'actions@users.noreply.github.com'
          git switch --orphan nfcps-web-work
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -R "$RUNNER_TEMP/cinema/." .
          printf '%s\n' 'NFCPS One web mirror with Cinema.' > BUILD.txt
          git add -A
          git commit -m 'Publish NFCPS Cinema web mirror'
          git push --force origin HEAD:nfcps-web
