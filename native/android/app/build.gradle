plugins {
    id 'com.android.application'
}

android {
    namespace 'org.nfcpsunizik.one'
    compileSdk 35

    defaultConfig {
        applicationId 'org.nfcpsunizik.one'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
