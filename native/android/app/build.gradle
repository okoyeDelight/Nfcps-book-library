plugins {
    id 'com.android.application'
}

android {
    namespace 'org.nfcpsunizik.one'
    compileSdk 35

    defaultConfig {
        applicationId 'org.nfcpsunizik.one'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '1.3.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
